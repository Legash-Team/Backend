name: Legash Backend CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:6.0
        ports:
          - 27017:27017

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run API Contract Checks
        run: npm run test:contract

      - name: Run Test Suite
        env:
          NODE_ENV: test
          MONGO_URI: mongodb://localhost:27017/legash-test
          JWT_SECRET: super_secret_jwt_key_for_testing_purposes
          JWT_EXPIRES_IN: 1d
        run: npm test